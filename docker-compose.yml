# Shared local service configuration. Development mounts are in docker-compose.override.yml.
# Production needs a complete application image, TLS, and private data-service networking.
services:
  postgres:
    # PostgreSQL with pgvector.
    image: docker.m.daocloud.io/pgvector/pgvector:pg16
    container_name: rag-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Runtime database files remain local and are excluded from Git.
      - ./data/runtime/postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    mem_limit: 1g

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: rag-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/runtime/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    mem_limit: 128m

  api:
    image: provident-api
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-api
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag}@postgres:5432/${POSTGRES_DB:-rag}
      REDIS_URL: redis://redis:6379/0
      HF_HOME: /models
      HF_ENDPOINT: https://hf-mirror.com
      # 覆盖 .env 里的 Windows 本机路径；模型在宿主机，不进镜像、不拉 CUDA
      EMBEDDING_MODEL_PATH: /models/modelscope/models/intfloat--multilingual-e5-small/snapshots/master
      RERANK_MODEL_PATH: /models/modelscope/models/BAAI--bge-reranker-base/snapshots/master
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/runtime/models:/models:ro
      - ./data/eval:/data/eval:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    mem_limit: 2g

  worker:
    image: provident-api
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-worker
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag}@postgres:5432/${POSTGRES_DB:-rag}
      REDIS_URL: redis://redis:6379/0
      HF_HOME: /models
      HF_ENDPOINT: https://hf-mirror.com
      EMBEDDING_MODEL_PATH: /models/modelscope/models/intfloat--multilingual-e5-small/snapshots/master
      RERANK_MODEL_PATH: /models/modelscope/models/BAAI--bge-reranker-base/snapshots/master
    volumes:
      - ./data/runtime/models:/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # API startup applies the existing migrations before its healthcheck passes.
      # A fresh database is not ready for the worker merely because pg_isready passes.
      api:
        condition: service_healthy
    command: ["python", "-m", "app.queue.worker"]
    restart: unless-stopped
    mem_limit: 2g
